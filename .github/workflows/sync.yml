name: Sync Canvas to Notion
on:
  schedule:
    - cron: "0 */3 * * *" # Runs automatically every 3 hours
  workflow_dispatch:       # Lets you trigger a manual sync button anytime on GitHub
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: node index.js
        env:
          CANVAS_DOMAIN: ${{ secrets.CANVAS_DOMAIN }}
          CANVAS_API_TOKEN: ${{ secrets.CANVAS_API_TOKEN }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          CLASSES_DB_ID: ${{ secrets.CLASSES_DB_ID }}
          ASSIGNMENTS_DB_ID: ${{ secrets.ASSIGNMENTS_DB_ID }}
